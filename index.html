<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生节点记录器</title>
<style>
:root{
  --bg:#F4F5F8; --panel:#FFFFFF; --rail:#FBFBFD;
  --border:#EAECF1; --border-2:#E2E5EC; --hairline:#F0F1F5;
  --text:#2B303B; --text-2:#6B7280; --text-3:#9AA2AE; --text-4:#B6BCC6;
  --primary:#6B5DE6; --primary-600:#5B4ED6; --primary-soft:#EEEDFC; --primary-softer:#F6F5FE;
  --shadow-card:0 1px 2px rgba(28,32,44,.04), 0 1px 3px rgba(28,32,44,.06);
  --shadow-pop:0 8px 28px rgba(28,32,44,.12), 0 2px 8px rgba(28,32,44,.08);
  --shadow-node:0 1px 2px rgba(28,32,44,.05), 0 2px 6px rgba(28,32,44,.05);
  --r-sm:7px; --r-md:10px; --r-lg:14px; --r-xl:18px;
  --c-edu:#34B864; --c-work:#3B82F6; --c-family:#14B8A6; --c-travel:#EF5364;
  --c-social:#8B5CF6; --c-growth:#F59E0B; --c-other:#9AA1AC;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
#root{height:100vh;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit; font-size:inherit; color:inherit;}
::selection{background:var(--primary-soft);}
.no-scrollbar::-webkit-scrollbar{width:0;height:0;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D8DBE2; border-radius:8px; border:2px solid transparent; background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:#C3C7D0; background-clip:padding-box; border:2px solid transparent;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- App shell ---------- */
.app{display:flex; flex-direction:column; height:100vh;}
.app-main{display:flex; flex:1; min-height:0;}
.icon{width:18px; height:18px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; flex:none;}
.icon.sm{width:15px; height:15px;}
.icon.xs{width:13px; height:13px;}

/* ---------- generic chips/buttons ---------- */
.iconbtn{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; color:var(--text-2); transition:.15s;}
.iconbtn:hover{background:var(--hairline); color:var(--text);}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600; line-height:1.6;}
.seg{display:flex; background:#EEF0F4; border-radius:9px; padding:3px;}
.seg button{padding:5px 14px; border-radius:7px; font-size:13px; font-weight:600; color:var(--text-2); transition:.15s;}
.seg button.on{background:#fff; color:var(--primary); box-shadow:var(--shadow-card);}

.fade-in{animation:fade .25s ease both;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="icons.jsx" type="text/babel"></script>
<script src="topbar.jsx" type="text/babel"></script>
<script src="sidebar.jsx" type="text/babel"></script>
<script src="canvas.jsx" type="text/babel"></script>
<script src="editpanel.jsx" type="text/babel"></script>
<script src="app.jsx" type="text/babel"></script>
</body>
</html>
